<!DOCTYPE html><html lang="pt-br"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>FARMALOG - WMS</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#07182a"></head><body>
<div id="screen-login" class="screen screen-login"><div class="login-shell"><div class="login-left-art" aria-hidden="true"></div><div class="login-card"><div class="brand"><div class="brand-sub">Sistema de Inventario</div><div class="brand-main">FARMALOG</div></div><div class="login-form"><input id="user" class="input" type="text" placeholder="Usuário" autocomplete="username"/><input id="senha" class="input" type="password" placeholder="Senha" autocomplete="current-password"/><button class="btn-primary" onclick="login()">ENTRAR</button><p id="login-msg" class="msg" aria-live="polite"></p></div><div class="login-credit">Criado por <strong>Jhony Willian</strong><br>com suporte OpenAI</div></div></div></div>

<div id="app" class="app-root hidden">
<header class="topbar"><div class="topbar-left">FARMALOG</div><div class="topbar-right"><button class="btn-logout" onclick="logout()">Sair</button></div></header>

<nav class="nav" role="navigation" aria-label="Menu principal">
<button class="nav-btn" onclick="showScreen('screen-register')">Registrar</button>
<button class="nav-btn" onclick="showScreen('screen-endereco')">Consultar</button>
<button class="nav-btn" onclick="showScreen('screen-abastecer')">Abastecer</button>
<button class="nav-btn" onclick="showScreen('screen-historico'); filtrarHistorico();">Histórico</button>

<!-- ========================= -->
<!-- ADIÇÃO FARMALOG - MENU   -->
<!-- ========================= -->
<button class="nav-btn" onclick="showScreen('screen-conferencia')">Conferência</button>
<button class="nav-btn" onclick="showScreen('screen-validade')">Validade</button>
</nav>

<main class="main" role="main">

<section id="screen-register" class="screen hidden" aria-labelledby="title-register">
<div class="card"><h2 id="title-register" class="card-title">REGISTRAR</h2>
<div class="row"><input id="busca" class="input" placeholder="Pesquisar (EAN / COD)"/><button class="btn-ghost" onclick="buscarProduto()">BUSCAR</button></div>
<div class="grid-2"><div><label class="label">EAN</label><input id="reg_ean" class="input" readonly/></div><div><label class="label">Nome</label><input id="reg_nome" class="input" readonly/></div></div>
<div class="grid-3"><div><label class="label">COD_IND</label><input id="reg_codind" class="input" readonly/></div><div><label class="label">COD_INT</label><input id="reg_codint" class="input" readonly/></div><div><label class="label">Endereço Prat.</label><input id="reg_endprat" class="input" readonly/></div></div>
<div class="grid-2"><div><label class="label">Lote</label><select id="reg_lote" class="input" onchange="atualizarValidadeReg()"></select></div><div><label class="label">Validade</label><input id="reg_validade" readonly class="input" readonly/></div></div>
<div class="grid-2"><div><label class="label">Endereço</label><input id="reg_endereco" class="input" placeholder="Ex: E-225"/></div><div><label class="label">Quantidade</label><input id="reg_qtd" class="input" type="number" min="0" value="1"/></div></div>
<button class="btn-primary" onclick="registrarProduto()">REGISTRAR</button></div>
</section>

<section id="screen-endereco" class="screen hidden" aria-labelledby="title-consulta">
<div class="card"><h2 id="title-consulta" class="card-title">CONSULTA DE ESTOQUE</h2>
<div class="row"><input id="q_search" class="input" placeholder="Pesquisar (EAN / Nome / Lote / COD / Endereço...)"/><button class="btn-primary" onclick="filtrarEstoque()">PESQUISAR</button></div>
<div class="table-wrap"><table id="estoque-tabela" class="table" role="table"><thead><tr><th>END</th><th>PRAT</th><th>EAN</th><th>COD_INT</th><th>COD_IND</th><th>PRODUTO</th><th>LOTE</th><th>VENC</th><th>QTDE</th><th>AÇÃO</th></tr></thead><tbody></tbody></table></div>
</div>
</section>

<section id="screen-abastecer" class="screen hidden" aria-labelledby="title-abastecer">
<div class="card"><h2 id="title-abastecer" class="card-title">ABASTECIMENTO</h2>
<label class="label">Endereço</label><input id="ab_endereco" class="input" placeholder="Ex: E-225"/>
<div class="row"><input id="ab_ean" class="input" placeholder="Buscar por EAN"/><button class="btn-ghost" onclick="abBuscar()">BUSCAR</button></div>
<label class="label">Produtos</label><select id="ab_produtos" class="input"></select>
<div class="grid-2"><div><label class="label">Lote</label><select id="ab_lotes" class="input" onchange="atualizarValidadeAb()"></select></div><div><label class="label">Validade</label><input id="ab_validade" readonly class="input" readonly/></div></div>
<label class="label">Quantidade</label><input id="ab_caixas" class="input" type="number" min="0" value="1"/>
<div class="grid-2 gap-12"><button class="btn-primary" onclick="abAdicionar()">+ ADICIONAR</button><button class="btn-danger" onclick="abRetirar()">- RETIRAR</button></div>
</div>
</section>

<section id="screen-historico" class="screen hidden" aria-labelledby="title-historico">
<div class="card"><h2 id="title-historico" class="card-title">HISTÓRICO</h2>
<div class="row"><input id="h_search" class="input" placeholder="Pesquisar (Usuário / Ação / EAN / Lote / Endereço...)"/><button class="btn-primary" onclick="filtrarHistorico()">PESQUISAR</button></div>
<div class="table-wrap"><table id="historico-tabela" class="table" role="table"><thead><tr><th>DATA</th><th>USUÁRIO</th><th>AÇÃO</th><th>EAN</th><th>LOTE</th><th>QTDE</th><th>END</th></tr></thead><tbody></tbody></table></div>
</div>
</section>

<!-- =========================================================== -->
<!-- ADIÇÃO FARMALOG - TELA CONFERÊNCIA                         -->
<!-- =========================================================== -->
<section id="screen-conferencia" class="screen hidden">
<div class="card"><h2 class="card-title">CONFERÊNCIA ERP × APP</h2>
<div class="row"><input id="conf-chave" class="input" placeholder="EAN ou Código"/><button class="btn-primary" onclick="buscarConferencia()">BUSCAR</button></div>
<div id="conf-result" class="table-wrap"></div>
</div>
</section>

<!-- =========================================================== -->
<!-- ADIÇÃO FARMALOG - TELA FEFO (VALIDADE)                     -->
<!-- =========================================================== -->
<section id="screen-validade" class="screen hidden">
<div class="card"><h2 class="card-title">VALIDADE (FEFO)</h2>
<div class="row"><input id="val-chave" class="input" placeholder="EAN ou Código"/><button class="btn-primary" onclick="buscarValidade()">BUSCAR</button></div>
<div id="val-result" class="table-wrap"></div>
</div>
</section>

</main></div>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
navigator.serviceWorker.register('service-worker.js')
.then(reg=>console.log('Service Worker registrado:',reg.scope))
.catch(err=>console.warn('Service Worker falhou:',err));
}
</script>
</body></html>
